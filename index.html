<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>a gente</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffefa0;--dot:#f4d654;--paper:#fffdf0;--ink:#38205c;--soft:#6f4fa3;--sun:#ffcc1f;--grape:#7a45c4;--lav:#d7c3f7;--on:#fff4b8;--tape:rgba(215,195,247,.9);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1e1033;--dot:#2d1a4b;--paper:#2b1946;--ink:#fff0b0;--soft:#cdb6f2;--sun:#ffd43b;--grape:#9a68e8;--lav:#4b2f7c;--on:#1e1033;--tape:rgba(255,212,59,.6)}}
:root[data-theme=dark]{--bg:#1e1033;--dot:#2d1a4b;--paper:#2b1946;--ink:#fff0b0;--soft:#cdb6f2;--sun:#ffd43b;--grape:#9a68e8;--lav:#4b2f7c;--on:#1e1033;--tape:rgba(255,212,59,.6)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(var(--dot) 1.5px,transparent 1.6px) 0 0/22px 22px,var(--bg);color:var(--ink);font:400 1.3rem/1.35 Gaegu,'Segoe Print','Bradley Hand',cursive}
main{max-width:30rem;margin:0 auto;padding:2rem 1.25rem 3rem;display:grid;gap:2.6rem;text-align:center}
svg{display:block}
h1,h2,.nota b,.blob b,.rel b{font-family:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:400;margin:0}
header{position:relative;padding-top:.5rem}
h1{font-size:clamp(3.4rem,18vw,5rem);line-height:1;color:var(--grape);text-shadow:3px 3px 0 var(--sun);transform:rotate(-2deg)}
header p{margin:.6rem 0 0;font-size:1.45rem;font-weight:700}
.dec{position:absolute;width:44px;height:44px;color:var(--ink);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.pol{position:relative;width:min(76vw,17rem);margin:0 auto;padding:.8rem .8rem 3.3rem;background:#fffdf5;color:#38205c;box-shadow:0 12px 24px rgba(40,20,70,.28);transform:rotate(3deg);animation:cai .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes cai{from{transform:translateY(-60px) rotate(-10deg);opacity:0}}
.pol::before{content:"";position:absolute;top:-14px;left:50%;width:96px;height:28px;background:var(--tape);transform:translateX(-50%) rotate(-4deg)}
.foto{aspect-ratio:4/5;background:#fff0a3;display:grid;place-items:center;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;object-position:50% 60%}
#vazio{display:grid;gap:.3rem;justify-items:center;font-size:1.3rem;font-weight:700}
#vazio svg{width:96px;height:96px}
.pol figcaption{position:absolute;left:0;right:0;bottom:.7rem;font-size:1.7rem;font-weight:700}
h2{font-size:1.5rem;color:var(--ink)}
.blob{width:min(78vw,17rem);aspect-ratio:1;margin:1.2rem auto .6rem;padding:1rem;display:grid;place-content:center;background:var(--grape);color:var(--on);border-radius:58% 42% 55% 45%/48% 56% 44% 52%;box-shadow:9px 9px 0 var(--sun);transform:rotate(-3deg)}
.blob b{font-size:clamp(4.5rem,26vw,7rem);line-height:1}
.blob span{font-size:1.5rem;font-weight:700;max-width:11ch;margin:0 auto}
.rel{display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem;margin:1.2rem 0 0}
.rel span{background:var(--sun);color:#38205c;padding:.1rem .9rem;border:2px dashed #38205c;border-radius:999px 999px 999px 4px;font-weight:700}
#marco p{margin:0;font-weight:700}
.trilha{position:relative;height:12px;margin:1.1rem .8rem 0;border-radius:9px;background:var(--lav)}
#barra{position:absolute;inset:0 auto 0 0;width:0;border-radius:9px;background:var(--sun);transition:width 1.2s ease}
#cor{position:absolute;top:-10px;left:0;width:30px;height:30px;color:var(--grape);transform:translateX(-50%)}
ul{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:1.8rem}
.nota{position:relative;padding:1rem 1.1rem 1.1rem;background:var(--paper);border-radius:6px 16px 8px 14px;box-shadow:5px 5px 0 var(--lav);text-align:left;transform:rotate(-1.2deg)}
.nota:nth-child(even){transform:rotate(1deg);box-shadow:5px 5px 0 var(--sun)}
.nota::before{content:"";position:absolute;top:-10px;left:50%;width:58px;height:18px;background:var(--tape);transform:translateX(-50%) rotate(-3deg)}
.nota time{display:block;color:var(--soft);font-weight:700}
.nota b{display:block;font-size:1.2rem;color:var(--grape);margin:.1rem 0 .3rem}
footer{font-size:1.3rem;color:var(--soft);display:grid;justify-items:center;gap:.3rem}
footer svg{width:26px;height:26px;color:var(--grape)}
footer button{all:unset;cursor:pointer;line-height:0;border-radius:50%}footer button:focus-visible{outline:3px dashed var(--grape);outline-offset:4px}footer button svg{transition:transform .2s}footer button:active svg{transform:scale(1.5) rotate(-10deg)}#egg{border:0;padding:2rem 1rem;width:100%;max-width:none;background:transparent;color:#fff4b8;text-align:center;overflow:visible}#egg::backdrop{background:rgba(30,16,51,.84)}#egg .pol{width:min(82vw,20rem);transform:rotate(-4deg)}#egg .foto{aspect-ratio:1}#egg img{object-position:40% 50%}#egg p{margin:1.6rem 0 0;font-size:1.3rem}
.song{justify-self:center;margin-top:-1rem;display:inline-flex;align-items:center;gap:.7rem;padding:.45rem .5rem .45rem .9rem;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px 999px 999px 8px;box-shadow:5px 5px 0 var(--grape);font:400 1.25rem 'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;text-decoration:none;transform:rotate(-1.5deg);transition:transform .15s,box-shadow .15s}
.song:active{transform:translate(2px,2px) rotate(-1.5deg);box-shadow:2px 2px 0 var(--grape)}
.song:focus-visible{outline:3px dashed var(--grape);outline-offset:4px}
.song svg{width:34px;height:34px;flex:none;animation:bate 1.8s ease-in-out infinite}
@keyframes bate{40%,60%{transform:scale(1.14)}}
.play{width:34px;height:34px;flex:none;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.play::before{content:"";width:12px;height:14px;margin-left:3px;background:var(--bg);clip-path:polygon(0 0,100% 50%,0 100%)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const LEGENDA_SEGREDO="achou o segredinho!";
// Novos momentos: o mais recente primeiro. Ex: {data:"2026-11-20",t:"Nosso primeiro mês",x:"Texto aqui"}
const MOMENTOS=[];
const MARCOS=[[30,"1 mês"],[100,"100 dias"],[182,"6 meses"],[365,"1 ano"],[500,"500 dias"],[730,"2 anos"],[1000,"1000 dias"],[1095,"3 anos"]];
/* ================================= */
const $=i=>document.getElementById(i);
if(FOTO){$("img").src=FOTO;$("img").hidden=false;$("vazio").hidden=true}
$("img2").src=SEGREDO;$("cap2").textContent=LEGENDA_SEGREDO;
const egg=$("egg");$("ovo").onclick=()=>egg.showModal();egg.onclick=()=>egg.close();
const ini=INICIO?new Date(INICIO):null;
function tick(){
  const ok=ini&&!isNaN(ini)&&Date.now()>=ini;
  $("rel").hidden=$("marco").hidden=!ok;
  if(!ok){$("dias").textContent="?";$("leg").textContent="começa no dia do nosso sim";return}
  const t=Date.now()-ini,d=Math.floor(t/864e5);
  $("dias").textContent=d;
  $("leg").textContent=(d==1?"dia":"dias")+" juntinhos";
  $("h").textContent=Math.floor(t/36e5)%24;
  $("m").textContent=Math.floor(t/6e4)%60;
  $("s").textContent=Math.floor(t/1e3)%60;
  const prox=MARCOS.find(x=>x[0]>d),ant=MARCOS.filter(x=>x[0]<=d).pop(),a=ant?ant[0]:0;
  if(prox){
    const f=prox[0]-d,p=(d-a)/(prox[0]-a)*100;
    $("falta").textContent="falta"+(f>1?"m ":" ")+f+" dia"+(f>1?"s":"")+" para "+prox[1];
    $("barra").style.width=p+"%";$("cor").style.left=p+"%";
  }else{
    $("falta").textContent="a gente já passou de todos os marcos, e o melhor é que não acaba";
    $("barra").style.width="100%";$("cor").style.left="100%";
  }
}
tick();setInterval(tick,1000);
$("lista").innerHTML=MOMENTOS.length?MOMENTOS.map(m=>`<li class="nota"><time>${new Date(m.data+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"})}</time><b>${m.t}</b>${m.x}</li>`).join(""):`<li class="nota"><b>o primeiro capítulo</b>começa no dia do sim. Daqui pra frente, cada coisa boa que a gente viver ganha um cantinho aqui.</li>`;
</script>
